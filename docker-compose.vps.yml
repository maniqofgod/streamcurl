services:
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "8081:80"
    depends_on:
      - api
    networks:
      - streamcurl-net

  api:
    build:
      context: ./backend
    ports: ["8001:8000"]
    volumes:
      - ./backend/media:/media
    env_file: .env
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started
    environment:
      - DATABASE_URL=postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db/${POSTGRES_DB}
      - REDIS_URL=redis://redis:6379
    restart: on-failure
    healthcheck:
      test: ["CMD-SHELL", "curl --fail http://localhost:8000/api/v1/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - streamcurl-net

  celery_worker:
    build:
      context: ./backend
    command: celery -A app.workers.stream_tasks worker --loglevel=info
    volumes:
      - ./backend/media:/media
    env_file: .env
    depends_on:
      - redis
      - db
    environment:
      - DATABASE_URL=postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db/${POSTGRES_DB}
      - REDIS_URL=redis://redis:6379
    restart: on-failure
    networks:
      - streamcurl-net

  db:
    image: postgres:13
    env_file:
      - .env
    volumes:
      - postgres_data:/var/lib/postgresql/data/
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U user -d mydatabase"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - streamcurl-net

  redis:
    image: redis:6-alpine
    networks:
      - streamcurl-net

  vps_agent:
    build:
      context: ./vps-agent
    ports:
      - "8002:8001"
    env_file:
      - .env
    restart: on-failure
    networks:
      - streamcurl-net

networks:
  streamcurl-net:
    driver: bridge

volumes:
  postgres_data: