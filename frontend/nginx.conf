server {
    listen 80;
    client_max_body_size 500M;
    server_name localhost;

    root /usr/share/nginx/html;

    location /fonts/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }
    index index.html;

    # This is crucial for Docker's internal DNS
    resolver 127.0.0.11 valid=10s;

    # This is the main entry point.
    # It tries to find the requested file or directory.
    # If it fails, it passes the request to the @spa fallback.
    location / {
        try_files $uri $uri/ @spa;
    }

    # This is the fallback for Single Page Applications.
    # It ensures that any deep links in your app are routed to index.html
    # so the frontend router can handle them. It will NOT be used
    # for existing files like .js or .css.
    location @spa {
        rewrite ^ /index.html last;
    }

    # Unified and more robust API location block
    location /api/v1/ {
        proxy_pass http://api:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 86400s;
        proxy_send_timeout 86400s;
    }

    # Media files location
    location /media/ {
        alias /usr/share/nginx/html/media/;
        autoindex off;
        try_files $uri =404;
    }
}
