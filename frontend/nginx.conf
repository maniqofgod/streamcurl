server {
    listen 80;
    server_name localhost;

    # Set a higher limit for file uploads
    client_max_body_size 10G;

    # Use Docker's internal DNS resolver
    resolver 127.0.0.11 valid=30s;
    set $backend_host "api";
    set $backend_port "8000";
    set $backend_service http://$backend_host:$backend_port;


    root /usr/share/nginx/html;
    index index.html;

    # Serve static files and the React app
    location / {
        try_files $uri /index.html;
    }

    # Proxy API requests to the backend service
    location /v1/ {
        proxy_pass $backend_service;
        proxy_request_buffering off;
        
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Proxy WebSocket requests to the backend service
    location /ws/ {
        proxy_pass $backend_service;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "Upgrade";
        proxy_set_header Host $host;
    }
    # Proxy media files to the backend service
    location /media/ {
        proxy_pass $backend_service;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
